<!doctype html>
<meta charset="utf-8">
<style>
  body{font:14px system-ui,sans-serif;width:300px;padding:12px;margin:0}
  label{display:block;margin:8px 0 2px;font-size:12px;color:#555}
  input{width:100%;box-sizing:border-box;padding:6px}
  button{margin-top:10px;width:100%;padding:9px;font-weight:600;cursor:pointer}
  #msg{margin-top:10px;font-size:13px;white-space:pre-wrap}
  details{margin-top:10px}
</style>
<button id="sync">Sincronizar esta pantalla</button>
<div id="msg"></div>
<details id="cfg">
  <summary>Configuración</summary>
  <label>Dirección del servidor RGO</label>
  <input id="url" placeholder="https://TU-SERVIDOR.onrender.com">
  <label>Llave de captura</label>
  <input id="key" type="password" placeholder="rgo_...">
  <button id="guardar">Guardar</button>
</details>
<script src="captura-core.js"></script>
<script src="popup.js"></script>
